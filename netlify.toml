[build]
    base = "app"
    command = "cd netlify/functions && npm install && cd ../.. && npm run build:prod"
    publish = "dist/browser"
    functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
    from = "/api/*"
    to = "/.netlify/functions/agent/:splat"
    status = 200
    force = true

[[redirects]]
    from = "/sitemap.xml"
    to = "/sitemap.xml"
    status = 200

[[redirects]]
    from = "/robots.txt"
    to = "/robots.txt"
    status = 200

[[redirects]]
    from = "/*"
    to = "/index.csr.html"
    status = 200

# Scheduled function for daily expiry notifications
[functions."expiry-notification"]
  # This is a cron expression that means "at 6:05 PM (18:05) UTC every day"
  schedule = "5 18 * * *"
